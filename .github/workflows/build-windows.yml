name: Build Windows EXE & Setup Installer

on:
  push:
    branches: [ "main", "master" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install NSIS Compiler
        run: |
          choco install nsis -y --no-progress

      - name: Run Tests
        run: |
          python -m unittest discover -v tests
        continue-on-error: true

      - name: Build Windows Executables
        run: |
          # 1. Build uncompressed folder structure for Setup Installer (Instant 0.05s launch)
          python -m PyInstaller --noconfirm --onedir --windowed --name "NeNgi_PDF" --icon "resources/app_icon.ico" --collect-all pymupdf --collect-all fitz --collect-all PyQt6 --hidden-import PyQt6 --hidden-import PIL --add-data "resources;resources" nengi/main.py

          # 2. Build standalone single-file portable binary
          python -m PyInstaller --noconfirm --onefile --windowed --name "NeNgi_PDF_Portable" --icon "resources/app_icon.ico" --collect-all pymupdf --collect-all fitz --collect-all PyQt6 --hidden-import PyQt6 --hidden-import PIL --add-data "resources;resources" nengi/main.py

      - name: Build Windows Setup Installer (NSIS)
        run: |
          $TAG = "${{ github.ref_name }}"
          if (-not $TAG -or $TAG -eq "main") { $TAG = "v1.6.2" }
          Copy-Item "dist\NeNgi_PDF_Portable.exe" -Destination "dist\NeNgi_PDF_${TAG}_Portable.exe"
          & "C:\Program Files (x86)\NSIS\makensis.exe" installer.nsi
          Copy-Item "dist\NeNgi_PDF_Setup.exe" -Destination "dist\NeNgi_PDF_${TAG}_Setup.exe"

      - name: Upload Windows Executable Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NeNgi-PDF-Windows-x64
          path: |
            dist/NeNgi_PDF_*.exe
          if-no-files-found: error

      - name: Create Release and Attach Installers (On Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/NeNgi_PDF_${{ github.ref_name }}_Setup.exe
            dist/NeNgi_PDF_${{ github.ref_name }}_Portable.exe
            dist/NeNgi_PDF_Setup.exe
            dist/NeNgi_PDF_Portable.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
