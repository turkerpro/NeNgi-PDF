      - name: Create Rolling 'beta-build' Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-build
          name: "NeNgi PDF – Beta (${{ steps.get_version.outputs.VERSION }})"
          body: |
            ## ⬇️ İndir (Beta)

            | Dosya | Açıklama |
            |-------|----------|
            | `NeNgi_PDF_*_Setup.exe` | **Önerilen** – Masaüstü kısayolu + .pdf ilişkilendirmesi kurar |
            | `NeNgi_PDF_*_Portable.exe` | Kurulum gerektirmez, tek dosya |

            > **Beta derlemesi** – `beta` dalına her yeni güncelleme geldiğinde bu sürüm yenilenir.
            > Commit: `${{ github.sha }}`
          prerelease: true
          files: |
            dist/NeNgi_PDF_${{ steps.get_version.outputs.VERSION }}_Setup.exe
            dist/NeNgi_PDF_${{ steps.get_version.outputs.VERSION }}_Portable.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
