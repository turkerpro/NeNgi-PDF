name: Build Windows EXE & Setup Installer

on:
  push:
    branches: [ "main", "master", "beta" ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    if: github.ref != 'refs/heads/beta'
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install NSIS Compiler
        run: |
          choco install nsis -y --no-progress

      - name: Run Tests
        run: |
          pip install pytest
          python -m pytest tests/test_core.py tests/test_features.py tests/test_batch.py tests/test_editing_render.py tests/test_tr_long_narrow.py tests/test_updater.py tests/test_v2bridge.py -v
        continue-on-error: false

      - name: Build Windows Setup Installer (onedir)
        run: |
          python -m PyInstaller `
            --noconfirm `
            --onedir `
            --windowed `
            --name "NeNgi_PDF" `
            --icon "resources/app_icon.ico" `
            --collect-all pymupdf `
            --collect-all fitz `
            --collect-all PyQt6 `
            --hidden-import PyQt6 `
            --hidden-import PyQt6.QtCore `
            --hidden-import PyQt6.QtGui `
            --hidden-import PyQt6.QtWidgets `
            --hidden-import PyQt6.QtPrintSupport `
            --hidden-import PIL `
            --hidden-import docx `
            --hidden-import openpyxl `
            --hidden-import pptx `
            --add-data "resources;resources" `
            nengi/main.py

      - name: Build Portable EXE (onefile)
        run: |
          python -m PyInstaller `
            --noconfirm `
            --onefile `
            --windowed `
            --name "NeNgi_PDF_Portable" `
            --icon "resources/app_icon.ico" `
            --collect-all pymupdf `
            --collect-all fitz `
            --collect-all PyQt6 `
            --hidden-import PyQt6 `
            --hidden-import PyQt6.QtCore `
            --hidden-import PyQt6.QtGui `
            --hidden-import PyQt6.QtWidgets `
            --hidden-import PyQt6.QtPrintSupport `
            --hidden-import PIL `
            --hidden-import docx `
            --hidden-import openpyxl `
            --hidden-import pptx `
            --add-data "resources;resources" `
            nengi/main.py

- name: Get Version
        id: get_version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag -or $tag -eq "main" -or $tag -eq "master") {
            $path = "nengi/ui/main_window.py"
            if (Test-Path $path) {
              $content = Get-Content $path -Raw
              Write-Host "DEBUG: File content length: $($content.Length)"
              $match = [regex]::Match($content, 'v(\d+\.\d+\.\d+(?:-beta)?)')
              if ($match.Success) {
                $ver = $match.Groups[1].Value
                Write-Host "DEBUG: Matched version: $ver"
              } else {
                Write-Host "DEBUG: No match found, using fallback"
                $ver = "2.0.10-beta"
              }
            } else {
              Write-Host "DEBUG: File not found at $path"
              $ver = "2.0.10-beta"
            }
            $tag = "v$ver"
          }
          echo "VERSION=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "DEBUG: Final version tag: $tag"

      - name: Build NSIS Setup Installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\NSIS\makensis.exe" installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "NSIS build failed" }

      - name: Rename Artifacts
        shell: pwsh
        run: |
          $ver = "${{ steps.get_version.outputs.VERSION }}"
          Copy-Item "dist\NeNgi_PDF_Portable.exe" "dist\NeNgi_PDF_${ver}_Portable.exe"
          Copy-Item "dist\NeNgi_PDF_Setup.exe" "dist\NeNgi_PDF_${ver}_Setup.exe"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NeNgi-PDF-Windows-x64-${{ steps.get_version.outputs.VERSION }}
          path: |
            dist/NeNgi_PDF_*_Setup.exe
            dist/NeNgi_PDF_*_Portable.exe
          if-no-files-found: error
          retention-days: 30

      - name: Delete Old 'latest-build' Release
        shell: pwsh
        run: |
          $headers = @{ Authorization = "Bearer ${{ secrets.GITHUB_TOKEN }}"; Accept = "application/vnd.github+json" }
          $releases = Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/releases" -Headers $headers
          $old = $releases | Where-Object { $_.tag_name -eq "latest-build" }
          if ($old) {
            Invoke-RestMethod -Method Delete -Uri "https://api.github.com/repos/${{ github.repository }}/releases/$($old.id)" -Headers $headers
            Start-Sleep -Seconds 2
            try { Invoke-RestMethod -Method Delete -Uri "https://api.github.com/repos/${{ github.repository }}/git/refs/tags/latest-build" -Headers $headers } catch {}
          }
        continue-on-error: true

      - name: Create Rolling 'latest-build' Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "NeNgi PDF – Son Derleme (${{ steps.get_version.outputs.VERSION }})"
          body: |
            ## ⬇️ İndir

            | Dosya | Açıklama |
            |-------|----------|
            | `NeNgi_PDF_*_Setup.exe` | **Önerilen** – Masaüstü kısayolu + .pdf ilişkilendirmesi kurar |
            | `NeNgi_PDF_*_Portable.exe` | Kurulum gerektirmez, tek dosya |

            > **Son otomatik derleme** – `main` dalına her yeni güncelleme geldiğinde bu sürüm yenilenir.
            > Commit: `${{ github.sha }}`
          prerelease: true
          files: |
            dist/NeNgi_PDF_${{ steps.get_version.outputs.VERSION }}_Setup.exe
            dist/NeNgi_PDF_${{ steps.get_version.outputs.VERSION }}_Portable.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Versioned Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "NeNgi PDF ${{ github.ref_name }}"
          files: |
            dist/NeNgi_PDF_${{ steps.get_version.outputs.VERSION }}_Setup.exe
            dist/NeNgi_PDF_${{ steps.get_version.outputs.VERSION }}_Portable.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-beta:
    if: github.ref == 'refs/heads/beta'
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
