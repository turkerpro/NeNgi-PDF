name: Build Windows EXE

on:
  push:
    branches: [ "main", "master" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run Tests
        run: |
          python -m unittest discover tests

      - name: Build Windows Executable (.exe)
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --name "NeNgi_PDF" --collect-all pymupdf --collect-all fitz --hidden-import PyQt6 --hidden-import PIL --add-data "resources;resources" nengi/main.py

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeNgi-PDF-Windows-x64
          path: dist/NeNgi_PDF.exe
          if-no-files-found: error

      - name: Create Release and Attach EXE (On Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NeNgi_PDF.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
